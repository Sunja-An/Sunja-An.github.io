{{ define "main" }}
  <section class="intro intro--sub wrap">
    <p class="t-label">{{ .Params.who }}</p>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="intro__lead">{{ . }}</p>{{ end }}
  </section>
  <section class="block wrap">
    {{- range .Pages.GroupByDate "2006" }}
    <h2 class="year">{{ .Key }}</h2>
    <ol class="rows-plain">{{ range .Pages }}{{ partial "tech-row.html" . }}{{ end }}</ol>
    {{- else }}
    <p class="muted">まだ記事はありません。</p>
    {{- end }}
  </section>
{{ end }}
