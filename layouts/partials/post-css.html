<style>
  /* reading pages grow with their text: no one-screen box, only the header's room above */
  .post { padding: calc(var(--nav) + var(--s-9)) 0 var(--s-10); min-height: 100svh; }
  .post h1 { font: var(--display-weight) var(--t-h2)/1.2 var(--font-display); letter-spacing: var(--display-tracking); margin: var(--s-4) 0 var(--s-7); word-break: auto-phrase; }
  .post__body { font-size: 17px; line-height: 1.9; }
  .post__body > * + * { margin-top: var(--s-5); }
  .post__body h2 { font: var(--display-weight) var(--t-h3)/1.3 var(--font-display); margin-top: var(--s-8); }
  .post__body h3 { font-size: var(--t-lead); font-weight: 500; margin-top: var(--s-7); }
  .post__body a { color: var(--action); text-decoration: underline; text-underline-offset: .2em; }
  .post__body pre { padding: var(--s-5); border-radius: var(--r-md); overflow-x: auto; font-size: 14px; line-height: 1.6; box-shadow: inset 0 0 0 1px var(--line); }
  .post__body :not(pre) > code { padding: 2px 6px; border-radius: var(--r-sm); background: var(--surface); font-size: .9em; }
  .post__body img { max-width: 100%; height: auto; border-radius: var(--r-md); }

  .post__other { margin-top: var(--s-8); }
</style>
